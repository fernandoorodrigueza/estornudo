
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.contenedor {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
}

#contador {
    font-size: 32px;
    font-weight: 400;
    color: #fff;
    font-variant-numeric: tabular-nums;
}

#estornudo {
    width: 90px;
    height: 90px;
    border: none;
    border-radius: 50%;
    background: #292929;
    cursor: pointer;
    transition: background 0.15s;
}

#estornudo:hover {
    background: #383838;
}

#estornudo:active {
    background: #444;
}

#reiniciar {
    border: none;
    background: transparent;
    color: #666;
    font-size: 24px;
    cursor: pointer;
    padding: 8px;
}

#reiniciar:hover {
    color: #aaa;
}

.sacudida {
    animation: sacudida 0.22s ease-in-out;
}

@keyframes sacudida {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-5px, 2px); }
    40%  { transform: translate(5px, -2px); }
    60%  { transform: translate(-4px, 1px); }
    80%  { transform: translate(3px, -1px); }
    100% { transform: translate(0, 0); }
}
</style>
</head>

<body>

<div class="contenedor">

    <button id="estornudo" aria-label="Estornudar"></button>

    <div id="contador">0</div>

    <button id="reiniciar" aria-label="Reiniciar contador"
    title="Reiniciar contador">&#8634;</button>

</div>

<script>
const boton = document.getElementById("estornudo");
const reiniciar = document.getElementById("reiniciar");
const contador = document.getElementById("contador");

let total = 0;

boton.addEventListener("click", () => {
    total++;
    contador.textContent = total;

    // Sacudida de la ventana
    document.body.classList.remove("sacudida");
    void document.body.offsetWidth;
    document.body.classList.add("sacudida");

    // Sonido de estornudo
    const audio = new Audio("estornudo.mp3");
    audio.play().catch(error => {
        console.error("No se pudo reproducir el sonido:", error);
    });
});

reiniciar.addEventListener("click", () => {
    total = 0;
    contador.textContent = total;
});
</script>

</body>
</html>
